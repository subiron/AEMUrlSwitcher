<!DOCTYPE html>
<html>
<head>
  <title>URL Switcher Configuration</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    textarea { width: 100%; height: 300px; margin-bottom: 10px; }
    button { padding: 8px 12px; margin-right: 5px; cursor: pointer; }
    .section { margin-bottom: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
    .status { margin-top: 10px; padding: 10px; border-radius: 4px; }
    .status.success { background-color: #d4edda; color: #155724; }
    .status.error { background-color: #f8d7da; color: #721c24; }
    h2 { margin-top: 0; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    input[type="file"] { display: none; }
    .btn-secondary { background-color: #f8f9fa; border: 1px solid #ddd; color: #333; }
    .btn-primary { background-color: #007bff; color: white; border: 1px solid #0056b3; }
    .btn-danger { background-color: #dc3545; color: white; border: 1px solid #a71d2a; }
  </style>
</head>
<body>
  <h1>URL Switcher Configuration</h1>
  
  <div id="status" class="status" style="display: none;"></div>

  <div class="section">
    <h2>Current Configuration</h2>
    <p>This is the active configuration used by the extension.</p>
    <textarea id="configJson" readonly></textarea>
    <div class="controls">
      <button id="saveConfig" class="btn-primary">Save Changes</button>
      <button id="exportConfig" class="btn-secondary">Export to JSON</button>
      <button id="importConfigBtn" class="btn-secondary">Import from JSON</button>
      <input type="file" id="importConfigFile" accept=".json">
      <button id="resetConfig" class="btn-danger">Reset to Default</button>
    </div>
  </div>

  <div class="section">
    <h2>Import from Cloud Services</h2>
    <p>Import configuration from Adobe Cloud Services API format (like <code>program.json</code>). This will overwrite the current configuration.</p>
    <div class="controls">
      <button id="importCloudBtn" class="btn-primary">Import Cloud JSON</button>
      <input type="file" id="importCloudFile" accept=".json">
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
